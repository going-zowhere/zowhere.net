<!--functions--------------------------------------->
<script>
    var curView = document.getElementById("maincontent");
    var lightMode = false;
    var docStyle = document.querySelector(':root');

    function switchContent(viewName) {
        curView.innerHTML = document.getElementById(viewName).innerHTML;
        document.title = "going zowhere - " + viewName;
    }

    function invertColors() {
        if (lightMode) {
            docStyle.style.setProperty('--bg-color', '#1a1a1a');
            docStyle.style.setProperty('--fg-color', '#ffffff');
            lightMode = false;
        } else {
            docStyle.style.setProperty('--bg-color', '#ffffff');
            docStyle.style.setProperty('--fg-color', '#1a1a1a');
            lightMode = true;
        }
    }
</script>
